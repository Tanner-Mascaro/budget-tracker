<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Budget">
    <meta name="color-scheme" content="light dark">
    <title>Budget Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="icon" type="image/png" sizes="192x192" href="images/icon-192.png">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="images/apple-touch-icon.png">
    <meta name="theme-color" content="#f2f2f7">
</head>

<body>
    <div class="input_card">

        <h2 id="page_title">New Purchase</h2>

        <div id="view_add" class="page">
            <div id="name_selector"></div>

            <div class="group">
                <div class="group_row">
                    <input type="text" id="item" name="item" placeholder="Item" autocomplete="off">
                </div>
                <div class="group_row">
                    <input type="number" id="item_amount" placeholder="Amount" inputmode="decimal">
                </div>
            </div>

            <button class="primary_button" id="add_button" onclick="addRecord()">Add Purchase</button>

            <div class="group today_card">
                <div class="summary_label">Today</div>
                <div id="today_total" class="today_total">$0.00</div>
                <div id="today_count" class="today_count"></div>
                <div id="today_people" class="today_people"></div>
            </div>
        </div>

        <div id="view_history" class="page" style="display: none;">
            <div class="group summary">
                <div class="summary_label">Total spent</div>
                <div id="history_total" class="history_total"></div>

                <div class="history_nav">
                    <button type="button" class="nav_button" id="prev_period_btn" onclick="stepHistory(-1)" aria-label="Previous week">&lsaquo;</button>
                    <span id="period_label">All Purchases</span>
                    <button type="button" class="nav_button" id="next_period_btn" onclick="stepHistory(1)" aria-label="Next week">&rsaquo;</button>
                    <button type="button" class="nav_button calendar_button" onclick="openPeriodPicker()" aria-label="Pick a date">
                        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                            <rect x="3" y="5" width="18" height="16" rx="3"></rect>
                            <line x1="3" y1="10" x2="21" y2="10"></line>
                            <line x1="8" y1="3" x2="8" y2="7"></line>
                            <line x1="16" y1="3" x2="16" y2="7"></line>
                        </svg>
                    </button>
                </div>

                <button type="button" id="clear_filter_btn" class="clear_filter_button" onclick="clearHistoryFilter()" style="display: none;">Show All Purchases</button>
            </div>

            <ul id="history_list" class="group history_list"></ul>
        </div>
    </div>

    <div id="range_modal" class="modal" style="display: none;" onclick="if (event.target === this) closePeriodPicker()">
        <div class="sheet">
            <div class="cal_header">
                <button type="button" class="nav_button" onclick="stepCalMonth(-1)" aria-label="Previous month">&lsaquo;</button>
                <span id="cal_title" class="cal_title"></span>
                <button type="button" class="nav_button" id="cal_next_month" onclick="stepCalMonth(1)" aria-label="Next month">&rsaquo;</button>
            </div>

            <div class="cal_weekdays">
                <span>S</span><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span>
            </div>
            <div id="cal_grid" class="cal_grid"></div>

            <div id="cal_hint" class="cal_hint"></div>

            <div class="cal_actions">
                <button type="button" class="sheet_button secondary" onclick="closePeriodPicker()">Cancel</button>
                <button type="button" class="sheet_button" id="cal_apply" onclick="applyPeriodPicker()">Apply</button>
            </div>
        </div>
    </div>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>

    <nav class="tab_bar">
        <button type="button" class="tab_button active" id="tab_add" onclick="showView('add')">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
            </svg>
            <span>Add</span>
        </button>
        <button type="button" class="tab_button" id="tab_history" onclick="showView('history')">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <line x1="8" y1="6" x2="20" y2="6"></line>
                <line x1="8" y1="12" x2="20" y2="12"></line>
                <line x1="8" y1="18" x2="20" y2="18"></line>
                <circle cx="4" cy="6" r="1" fill="currentColor"></circle>
                <circle cx="4" cy="12" r="1" fill="currentColor"></circle>
                <circle cx="4" cy="18" r="1" fill="currentColor"></circle>
            </svg>
            <span>History</span>
        </button>
    </nav>

    <script src="script.js"></script>
</body>

</html>
